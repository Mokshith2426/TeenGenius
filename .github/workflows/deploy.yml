# Deploy the static Vite build to GitHub Pages.
# Netlify is unaffected: it keeps running `npm run build` (which also bundles
# the server) and publishing `dist` from the domain root.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Grants only what Pages deployment needs: read the repo, publish Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two Pages deployments race each other.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Build with GitHub Pages base path
        run: npm run build:pages
        env:
          # vite.config.ts keys the base path off this value.
          GITHUB_PAGES_BASE: ${{ vars.GITHUB_PAGES_BASE || '/TeenGenius/' }}

      - name: Generate SPA fallback for direct links and refreshes
        # GitHub Pages has no server rewrite rules, so it serves /404.html for any
        # unknown path. This copies index.html to 404.html and adds a small script
        # that hands the original path back to the app.
        run: cp dist/index.html dist/404.html && node scripts/append-404-redirect.mjs dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4